[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-data-core"
version = "0.1.0"
description = "Shared standard-library document schema and split provenance for Ariadne experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ariadne_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
